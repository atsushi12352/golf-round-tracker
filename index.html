<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<title>ゴルフ記録</title>
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="h-title">ゴルフラウンド記録</div>
    <div id="warnBanner"></div>
  </header>

  <main>
    <button class="btn primary block" id="startRoundBtn" style="min-height:56px;font-size:16px;">ラウンド開始</button>

    <div class="nav-row">
      <a class="nav-card" href="dashboard.html">累積ダッシュボード</a>
      <a class="nav-card" href="settings.html">設定</a>
    </div>

    <div class="card">
      <h2>ラウンド一覧</h2>
      <div class="round-list" id="roundList"><div class="empty-state">読み込み中…</div></div>
    </div>
  </main>
</div>

<div class="overlay" id="deleteConfirmOverlay">
  <div class="sheet">
    <h2>ラウンドを削除しますか?</h2>
    <p class="sheet-text" id="deleteConfirmText"></p>
    <p class="sheet-text">この操作は取り消せません。</p>
    <div class="sheet-btns">
      <button class="sheet-btn danger" id="deleteConfirmYes">削除する</button>
      <button class="sheet-btn ghost" id="deleteConfirmNo">戻る</button>
    </div>
  </div>
</div>

<script type="module" src="js/home.js"></script>
<script type="module" src="js/sw-register.js"></script>
</body>
</html>
