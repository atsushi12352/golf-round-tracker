<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<title>設定 - ゴルフ記録</title>
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="h-sub"><a href="index.html" style="color:#fff;opacity:.85;">&larr; ホーム</a></div>
    <div class="h-title">設定</div>
  </header>

  <main>
    <div class="card">
      <h2>使用クラブ</h2>
      <div class="club-toggle-grid" id="clubToggleGrid"></div>
      <div class="hm-note" style="margin-top:8px;">PTは常時使用します。変更しても過去のラウンド記録は変わりません。</div>
    </div>

    <div class="card">
      <h2>コース管理</h2>
      <div class="round-list" id="courseList"></div>
      <div class="hm-note" style="margin-top:8px;">ラウンドの記録が残っているコースは削除できません。</div>
    </div>

    <div class="card backup-row">
      <h2>バックアップ</h2>
      <div class="backup-status" id="backupStatus">-</div>
      <button class="btn primary block" id="exportBtn">エクスポート(JSONダウンロード)</button>
      <button class="btn ghost block" id="importBtn">インポート(JSONファイルを選択)</button>
      <input type="file" accept="application/json" class="hidden-file" id="importFile">
      <div class="hm-note">Safariのストレージは端末の状況によって消去されることがあります。ラウンド後は定期的にエクスポートしてください。</div>
    </div>
  </main>
</div>

<div class="overlay" id="courseDeleteConfirmOverlay">
  <div class="sheet">
    <h2>コースを削除しますか?</h2>
    <p class="sheet-text" id="courseDeleteConfirmText"></p>
    <div class="sheet-btns">
      <button class="sheet-btn danger" id="courseDeleteConfirmYes">削除する</button>
      <button class="sheet-btn ghost" id="courseDeleteConfirmNo">戻る</button>
    </div>
  </div>
</div>

<div class="overlay" id="importConfirmOverlay">
  <div class="sheet">
    <h2>インポートしますか?</h2>
    <p class="sheet-text">現在端末に保存されている設定・コース・ラウンドはすべて、選択したファイルの内容で上書きされます。この操作は取り消せません。</p>
    <div class="sheet-btns">
      <button class="sheet-btn danger" id="importConfirmYes">上書きしてインポート</button>
      <button class="sheet-btn ghost" id="importConfirmNo">キャンセル</button>
    </div>
  </div>
</div>

<script type="module" src="js/settings.js"></script>
<script type="module" src="js/sw-register.js"></script>
</body>
</html>
